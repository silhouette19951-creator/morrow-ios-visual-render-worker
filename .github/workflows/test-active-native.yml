name: Test direct replacement of the active native poster

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Standard public macOS runner to test
        required: true
        default: macos-26

permissions:
  contents: read

jobs:
  test:
    name: Test active native poster replacement
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 14

    steps:
      - name: Check out visual worker
        uses: actions/checkout@v5

      - name: Decrypt one private wallpaper in runner memory
        env:
          MORROW_ASSET_KEY: ${{ secrets.MORROW_ASSET_KEY }}
        run: |
          mkdir -p decrypted
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in assets-encrypted/04-mirror-salt-moon.jpg.enc \
            -out decrypted/wallpaper.jpg \
            -pass env:MORROW_ASSET_KEY

      - name: Boot visual iPhone simulator
        env:
          DEVICE_HINT: Pro Max
          WALLPAPER: decrypted/wallpaper.jpg
        run: bash scripts/boot-simulator.sh

      - name: Replace current native poster and force a fresh render
        env:
          WALLPAPER: output/import-wallpaper.jpg
        run: bash scripts/replace-active-photo-poster.sh

      - name: Seal private native-render proof
        if: always()
        env:
          MORROW_ASSET_KEY: ${{ secrets.MORROW_ASSET_KEY }}
        run: |
          mkdir -p proof
          for file in output/after-active-poster-replacement.png output/replaced-active-poster.txt output/replaced-active-poster-db.txt output/selection.txt output/xcode-version.txt; do
            if [[ -f "$file" ]]; then cp "$file" proof/; fi
          done
          tar -czf test-active-native.tar.gz proof
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in test-active-native.tar.gz \
            -out sealed-test-active-native.tar.gz.enc \
            -pass env:MORROW_ASSET_KEY

      - name: Upload encrypted native-render proof
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sealed-test-active-native
          path: sealed-test-active-native.tar.gz.enc
          if-no-files-found: error
          retention-days: 1
