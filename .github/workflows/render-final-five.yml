name: Render five final Morrow native lock screens

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Standard public macOS runner
        required: true
        default: macos-26

permissions:
  contents: read

jobs:
  render:
    name: Final ${{ matrix.id }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - id: 01-mist-cathedral
            asset: assets-encrypted/01-mist-cathedral.jpg.enc
          - id: 02-pearl-coast
            asset: assets-encrypted/02-pearl-coast.jpg.enc
          - id: 03-rosy-after-rain
            asset: assets-encrypted/03-rosy-after-rain.jpg.enc
          - id: 04-mirror-salt-moon
            asset: assets-encrypted/04-mirror-salt-moon.jpg.enc
          - id: 05-moonlit-glasshouse
            asset: assets-encrypted/05-moonlit-glasshouse.jpg.enc

    steps:
      - name: Check out visual worker
        uses: actions/checkout@v5

      - name: Decrypt private wallpaper in runner memory
        env:
          MORROW_ASSET_KEY: ${{ secrets.MORROW_ASSET_KEY }}
          SEALED_ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p decrypted
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$SEALED_ASSET" \
            -out decrypted/wallpaper.jpg \
            -pass env:MORROW_ASSET_KEY

      - name: Boot visual iPhone simulator
        env:
          DEVICE_HINT: Pro Max
          WALLPAPER: decrypted/wallpaper.jpg
        run: bash scripts/boot-simulator.sh

      - name: Install visual controller
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Create native photo poster and stretched clock
        env:
          PHOTO_POINT: 16%,52%
          MAESTRO_CLI_NO_ANALYTICS: 1
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        run: |
          maestro test \
            -e PHOTO_POINT="$PHOTO_POINT" \
            --debug-output output/maestro-set-wallpaper \
            flows/set-wallpaper.yaml

      - name: Replace black photo provider with private static system poster
        env:
          WALLPAPER: output/import-wallpaper.jpg
          SOURCE_PROVIDER_HINT: com.apple.PhotosUIPrivate.PhotosPosterProvider
        run: bash scripts/replace-active-photo-poster.sh

      - name: Wake, clear setup notice, and capture native lock screen
        continue-on-error: true
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        run: maestro test --debug-output output/maestro-clean flows/clear-notifications-and-capture.yaml

      - name: Seal final private screenshots
        if: always()
        env:
          MORROW_ASSET_KEY: ${{ secrets.MORROW_ASSET_KEY }}
          RENDER_ID: ${{ matrix.id }}
        run: |
          mkdir -p proof
          find output -type f -name '*.png' -print0 | while IFS= read -r -d '' file; do
            safe_name="$(echo "$file" | tr '/ ' '__')"
            cp "$file" "proof/$safe_name"
          done
          for file in output/replaced-active-poster.txt output/replaced-active-poster-db.txt output/source-title-style.xml output/selection.txt output/xcode-version.txt; do
            if [[ -f "$file" ]]; then cp "$file" proof/; fi
          done
          tar -czf "final-$RENDER_ID.tar.gz" proof
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "final-$RENDER_ID.tar.gz" \
            -out "sealed-final-$RENDER_ID.tar.gz.enc" \
            -pass env:MORROW_ASSET_KEY

      - name: Upload encrypted final result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sealed-final-${{ matrix.id }}
          path: sealed-final-${{ matrix.id }}.tar.gz.enc
          if-no-files-found: error
          retention-days: 1
