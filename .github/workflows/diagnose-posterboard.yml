name: Diagnose encrypted Morrow PosterBoard state

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Standard public macOS runner to inspect
        required: true
        default: macos-26-intel

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose real iOS PosterBoard
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 25

    steps:
      - name: Check out visual worker
        uses: actions/checkout@v5

      - name: Decrypt one private wallpaper in runner memory
        env:
          MORROW_ASSET_KEY: ${{ secrets.MORROW_ASSET_KEY }}
        run: |
          mkdir -p decrypted
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in assets-encrypted/04-mirror-salt-moon.jpg.enc \
            -out decrypted/wallpaper.jpg \
            -pass env:MORROW_ASSET_KEY

      - name: Boot visual iPhone simulator
        env:
          DEVICE_HINT: Pro Max
          WALLPAPER: decrypted/wallpaper.jpg
        run: bash scripts/boot-simulator.sh

      - name: Install visual controller
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Create native photo poster and stretched clock
        continue-on-error: true
        env:
          PHOTO_POINT: 16%,52%
          MAESTRO_CLI_NO_ANALYTICS: 1
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        run: |
          set -o pipefail
          maestro test \
            -e PHOTO_POINT="$PHOTO_POINT" \
            --debug-output output/maestro-set-wallpaper \
            flows/set-wallpaper.yaml \
            2>&1 | tee output/set-wallpaper.log

      - name: Collect native PosterBoard state
        if: always()
        run: bash scripts/collect-posterboard-state.sh

      - name: Seal private diagnostics
        if: always()
        env:
          MORROW_ASSET_KEY: ${{ secrets.MORROW_ASSET_KEY }}
        run: |
          mkdir -p proof
          find output -type f -name '*.png' -print0 | while IFS= read -r -d '' file; do
            safe_name="$(echo "$file" | tr '/ ' '__')"
            cp "$file" "proof/$safe_name"
          done
          for file in output/set-wallpaper.log output/selection.txt output/xcode-version.txt output/posterboard-state.tar.gz; do
            if [[ -f "$file" ]]; then cp "$file" proof/; fi
          done
          tar -czf diagnose-posterboard.tar.gz proof
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in diagnose-posterboard.tar.gz \
            -out sealed-diagnose-posterboard.tar.gz.enc \
            -pass env:MORROW_ASSET_KEY

      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sealed-diagnose-posterboard
          path: sealed-diagnose-posterboard.tar.gz.enc
          if-no-files-found: error
          retention-days: 1
